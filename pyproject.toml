[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-mentor-dev"
version = "0.1.0"
description = "Development tooling for the Project Mentor Agent Skill"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tianyi Wei" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = [
  ".agents/skills/project-mentor/scripts/mentor_core",
  "tools",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
