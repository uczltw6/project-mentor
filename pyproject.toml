[build-system]
requires = ["setuptools>=77,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "project-mentor"
version = "0.3.0"
description = "Local, evidence-grounded learning receipts for real technical projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tianyi Wei" }]
keywords = ["agent-skills", "codex", "learning", "mentoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/uczltw6/project-mentor"
Repository = "https://github.com/uczltw6/project-mentor"
Issues = "https://github.com/uczltw6/project-mentor/issues"
Changelog = "https://github.com/uczltw6/project-mentor/blob/main/CHANGELOG.md"

[project.scripts]
project-mentor = "project_mentor_cli.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.11,<3",
  "pyyaml>=6.0,<7",
  "pytest>=8.3,<10",
  "ruff>=0.6,<1",
  "setuptools>=77,<90",
]

[tool.setuptools]
packages = ["project_mentor_cli"]

[tool.setuptools.package-dir]
project_mentor_cli = ".agents/skills/project-mentor/scripts/mentor_core"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
norecursedirs = ["tests/behavior/fixtures"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = [
  ".agents/skills/project-mentor/scripts/mentor_core",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
