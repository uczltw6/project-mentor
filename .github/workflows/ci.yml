name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, format, and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Smoke-test installed CLI entry points
        run: |
          project-mentor --version
          python -m project_mentor_cli --version
      - name: Build release distributions
        run: python -m build --no-isolation --outdir "$RUNNER_TEMP/dist" .
      - name: Validate release distributions
        run: python tools/validate_distribution.py --dist-dir "$RUNNER_TEMP/dist" --version 0.3.0
      - name: Install and smoke-test the built wheel
        run: python tools/smoke_test_wheel.py --dist-dir "$RUNNER_TEMP/dist" --version 0.3.0 --skill-root .agents/skills/project-mentor
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check types
        run: python -m mypy --strict .agents/skills/project-mentor/scripts tools
      - name: Scan releasable files and Git history
        run: python tools/repository_scan.py --all

  linux-tests:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  windows-tests:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  coverage:
    name: Branch coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Run branch coverage
        run: python -m coverage run --branch -m pytest -q
      - name: Enforce coverage gate
        run: python -m coverage report --fail-under=90

  skill-structure:
    name: Skill structure and parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned official skills tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: _official-skills
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Stage a personal-scope copy
        run: python -c "from pathlib import Path; import shutil; shutil.copytree(Path('.agents/skills/project-mentor'), Path.home() / '.agents/skills/project-mentor')"
      - name: Check exact personal/public parity
        run: python tools/sync_skill.py --check
      - name: Run official skill validation
        run: python tools/run_official_skill_validation.py --skill .agents/skills/project-mentor --validator _official-skills/skills/.system/skill-creator/scripts/quick_validate.py
      - name: Run repository and plugin contract tests
        run: python -m pytest tests/structure -q

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [quality, linux-tests, windows-tests, coverage, skill-structure]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = {name: job["result"] for name, job in json.loads(os.environ["JOB_RESULTS"]).items()}
          print(json.dumps(results, sort_keys=True))
          sys.exit(0 if all(result == "success" for result in results.values()) else 1)
          PY
