name: Feature request
description: Propose a focused improvement to the skill or helper
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real project-learning situation is not handled well today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Representative synthetic example
      description: Show the natural request and desired boundary without private project data.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Activation
        - Mentoring modes
        - Evidence and receipts
        - Persistence and privacy
        - Python helper
        - Documentation and compatibility
    validations:
      required: true
